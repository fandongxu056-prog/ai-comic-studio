[project]
name = "ai-comic-studio"
version = "0.1.0"
description = "AI Comic Animation Creation SaaS Platform"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AI Comic Studio Team"}
]

dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "langgraph>=0.3,<1.0",
    "langchain>=0.3,<1.0",
    "langchain-openai>=0.3,<1.0",
    "langchain-anthropic>=0.3,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "celery[redis]>=5.4,<6.0",
    "redis>=5.2,<6.0",
    "minio>=7.2,<8.0",
    "httpx>=0.28,<1.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[argon2]>=1.7,<2.0",
    "ffmpeg-python>=0.2,<1.0",
    "Pillow>=11.0,<12.0",
    "openai>=1.68,<2.0",
    "anthropic>=0.45,<1.0",
    "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
